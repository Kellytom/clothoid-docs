site_name: clothoid-lab
site_url: https://kellytom.github.io/clothoid-docs/
repo_url: https://github.com/Kellytom/clothoid-docs
repo_name: Kellytom/clothoid-docs
site_description: Exact clothoid geometry for ornament, and the rational spine layer
theme:
  name: material
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
docs_dir: site_src
site_dir: site
nav:
  - Start here:
      - Home: index.md
      - Architecture: docs/ARCHITECTURE.md
      - Plan: PLAN.md
      - Documentation index: docs/README.md
  - Guides:
      - Web application guide: docs/WEB-GUIDE.md
      - Spine layer guide: docs/SPINE.md
      - Glossary: docs/GLOSSARY.md
      - Vocabulary: VOCABULARY.md
  - Concepts:
      - Curve model: docs/CURVE-MODEL.md
      - Philosophy: docs/PHILOSOPHY.md
      - Clearance: docs/CLEARANCE.md
      - Junctions: docs/JUNCTION.md
      - Primals: docs/PRIMAL.md
  - Reference:
      - Recovered corpus: docs/CORPUS.md
      - Work items and the board: docs/WORK.md
      - Generated pages: generated.md
      - The 3125 lattice: docs/clothoid-grid-3125.md
      - Caps: docs/caps.md
      - The web MVP: docs/web.md
  - Spine layer in depth:
      - Explainer: spine/EXPLAINER.md
      - Six studies: spine/GALLERY.md
      - Extremes: spine/EXTREMES.md
      - Placement and transfer: spine/TRANSFER.md
      - The cloud: spine/CLOUD.md
      - The cloud in four arcs: spine/CLOUD-FORM.md
      - Spine handover: spine/HANDOVER.md
      - Spine audit: spine/AUDIT.md
  - Project:
      - Status: docs/STATUS.md
      - Verification: docs/VERIFY.md
      - Handover: docs/HANDOVER.md
      - Current truth: docs/HANDOFF.md
      - Backlog: docs/BACKLOG.md
      - Review: docs/REVIEW.md
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
      - Code of conduct: CODE_OF_CONDUCT.md
      - Licence: LICENSE.md
      - Credits: docs/CREDITS.md
  - Archive:
      - History: docs/PROJECT.md
      - Older tasks: docs/TODO.md
      - Ornaments source: ORNAMENTS.md
      - House conventions: GRID8.md
